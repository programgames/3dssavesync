<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <!-- 3dssavesync : une 3DS et un écran de PC, reliés par une flèche double. PNG et .ico : python assets/generer.py -->
  <rect width="256" height="256" rx="44" fill="#182848"/>
  <g fill="#78c8ff">
    <!-- 3DS : écran du haut, écran du bas -->
    <rect x="20" y="36" width="96" height="66" rx="10"/>
    <rect x="28" y="110" width="80" height="70" rx="10"/>
    <!-- PC : écran, pied, socle -->
    <rect x="140" y="44" width="100" height="78" rx="10"/>
    <rect x="178" y="120" width="24" height="30"/>
    <rect x="158" y="146" width="64" height="14" rx="7"/>
  </g>
  <g fill="#182848">
    <rect x="32" y="48" width="72" height="42" rx="3"/>
    <rect x="44" y="122" width="48" height="46" rx="3"/>
    <rect x="152" y="56" width="76" height="54" rx="3"/>
  </g>
  <!-- flèche double -->
  <g fill="#ffffff">
    <rect x="64" y="203" width="128" height="18"/>
    <path d="M22 212 L68 182 L68 242 Z"/>
    <path d="M234 212 L188 182 L188 242 Z"/>
  </g>
</svg>
