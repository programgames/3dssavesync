# 3dssavesync server with automatic HTTPS (Caddy), when there is no reverse proxy yet.
# Needs: a domain name that points to this machine, ports 80 and 443 open to it.
# .env (chmod 600):
#   NDSSYNC_TOKEN=<long random token>
#   DOMAINE=saves.example.com
# Start: docker compose -f docker-compose.caddy.yml up -d
services:
  3dssavesync:
    image: ghcr.io/programgames/3dssavesync-server:latest
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./data:/data
  caddy:
    image: caddy:2
    restart: unless-stopped
    env_file: .env
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy-data:/data
