name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  serveur:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m unittest -v test_server.py
        working-directory: server
      - run: pipx run ruff==0.17.3 check server/
      # The release publishes this image for amd64 and arm64: a PR checks that both still build.
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: server
          platforms: linux/amd64,linux/arm64

  tests-c:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: state, key, files (host C)
        working-directory: 3ds
        run: |
          gcc -std=c99 -Wall -Wextra -Werror -I source source/state.c test/test_state.c -o /tmp/t && /tmp/t ../tests/cas_etat.csv
          gcc -std=c99 -Wall -Wextra -Werror -I source source/state.c source/games.c test/test_games.c -o /tmp/g && /tmp/g
          gcc -std=c99 -Wall -Wextra -Werror -I source source/state.c source/games.c source/filter.c test/test_filter.c -o /tmp/i && /tmp/i
          gcc -std=c99 -Wall -Wextra -Werror -I source source/key.c test/test_key.c -o /tmp/c && /tmp/c
          gcc -std=c99 -Wall -Wextra -Werror -I source source/files.c test/test_files.c -o /tmp/f && (cd /tmp && /tmp/f)
          gcc -std=c99 -Wall -Wextra -Werror -I source source/files.c source/settings.c test/test_settings.c -o /tmp/r && (cd /tmp && /tmp/r)
          gcc -std=c99 -Wall -Wextra -Werror -I source source/pokemon.c test/test_pokemon.c -o /tmp/p && /tmp/p
          gcc -std=c99 -Wall -Wextra -Werror -I source source/errors.c test/test_errors.c -o /tmp/e && /tmp/e
          gcc -std=c99 -Wall -Wextra -Werror -I source source/text.c test/test_text.c -o /tmp/x && /tmp/x
          gcc -std=c99 -Wall -Wextra -Werror -I source source/pairing.c test/test_pairing.c -o /tmp/q && /tmp/q
          gcc -std=c99 -Wall -Wextra -Werror -I source source/errors.c source/text.c source/result.c test/test_result.c -o /tmp/s && /tmp/s
          gcc -std=c99 -Wall -Wextra -Werror -I source source/files.c source/update.c test/test_update.c -o /tmp/m && /tmp/m test/release_latest.json
          gcc -std=c99 -Wall -Wextra -Werror -I source source/files.c source/list.c test/test_list.c -o /tmp/l && /tmp/l ../tests/saves.json
          gcc -std=c99 -Wall -Wextra -Werror -I source source/vc.c test/test_vc.c -o /tmp/v && /tmp/v
          gcc -std=c99 -Wall -Wextra -Werror -I source source/files.c source/archive.c test/test_archive.c -o /tmp/a && /tmp/a ../tests/archive3ds/cases.json

  client-go:
    strategy:
      fail-fast: false
      matrix:
        # macOS : peu de machines pour un compte gratuit, longue attente (v3.11.0 : deux tentatives annulées faute de
        # machine). Seulement après la fusion (main), jamais avant une release : un tag n'attend pas macOS. Les PR et
        # les tags vérifient quand même que le code compile pour macOS (go vet croisé), et la release le compile.
        os: ${{ github.ref == 'refs/heads/main' && fromJSON('["windows-latest", "ubuntu-latest", "macos-latest"]') || fromJSON('["windows-latest", "ubuntu-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-go@v5
        with:
          go-version-file: client/go.mod
          cache: false
      - run: go vet ./...
        working-directory: client
      - name: go vet pour macOS (compilation croisée)
        if: matrix.os == 'ubuntu-latest'
        run: GOOS=darwin GOARCH=arm64 go vet ./...
        working-directory: client
      - run: go test -count=1 -v ./...
        working-directory: client

  lint-go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: client/go.mod
          cache: false
      - name: gofmt
        working-directory: client
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then echo "Run gofmt -w on:"; echo "$out"; exit 1; fi
      # Any finding fails the job, for each target system (build tags select different files).
      - name: staticcheck
        working-directory: client
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@v0.8.2
          for goos in windows linux darwin; do
            echo "::group::GOOS=$goos"
            GOOS=$goos "$(go env GOPATH)/bin/staticcheck" ./... || status=1
            echo "::endgroup::"
          done
          exit ${status:-0}

  android:
    runs-on: ubuntu-latest
    env:
      # The release APK needs the signing key (repository secrets). Without it, the step is skipped and the release
      # goes on without the APK. Never a key made by the CI: each APK must install over the previous one (ADR 0026).
      ANDROID_SIGNING: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' && 'yes' || 'no' }}
    steps:
      - uses: actions/checkout@v4
      # Java 21 for the unit tests (Robolectric runs Android 16 only on 21: the Gradle toolchain of app/build.gradle.kts
      # finds it through JAVA_HOME_21_X64), Java 17 for Gradle and the build (the last one listed is the default).
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            21
            17
      # The JVM tests sync against the real server/server.py.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # Android SDK of the runner (ANDROID_HOME); Gradle adds platform 36 and the build-tools of AGP if they are missing.
      - name: Unit tests, lint, debug APK
        working-directory: android
        run: ./gradlew --no-daemon -Porg.gradle.java.installations.fromEnv=JAVA_HOME_21_X64 testDebugUnitTest lintDebug assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
      # Tag v3.10.0 -> versionName 3.10.0, versionCode 31000 (major*10000 + minor*100 + patch: grows with each release
      # while minor and patch stay below 100). R8 shrinks it; the unit tests above ran on the same code.
      - name: Signed release APK
        if: startsWith(github.ref, 'refs/tags/v') && env.ANDROID_SIGNING == 'yes'
        working-directory: android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          export ANDROID_KEYSTORE_FILE="$RUNNER_TEMP/release.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$ANDROID_KEYSTORE_FILE"
          version="${GITHUB_REF_NAME#v}"
          IFS=. read -r major minor patch <<< "${version%%-*}"
          export ANDROID_VERSION_NAME="$version"
          export ANDROID_VERSION_CODE=$((major * 10000 + minor * 100 + patch))
          ./gradlew --no-daemon assembleRelease
          rm -f "$ANDROID_KEYSTORE_FILE"
          mkdir -p ../apk && cp app/build/outputs/apk/release/app-release.apk ../apk/3dssavesync-android.apk
      - uses: actions/upload-artifact@v4
        if: startsWith(github.ref, 'refs/tags/v') && env.ANDROID_SIGNING == 'yes'
        with:
          name: android-release-apk
          path: apk/3dssavesync-android.apk

  homebrew-3ds:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: makerom et bannertool
        run: |
          mkdir -p outils && cd outils
          curl -sSfL --retry 5 --retry-all-errors --retry-delay 5 -O https://github.com/3DSGuy/Project_CTR/releases/download/makerom-v0.19.0/makerom-v0.19.0-ubuntu_x86_64.zip
          curl -sSfL --retry 5 --retry-all-errors --retry-delay 5 -O https://github.com/Epicpkmn11/bannertool/releases/download/v1.2.2/bannertool.zip
          unzip -q -o makerom-v0.19.0-ubuntu_x86_64.zip -d makerom
          unzip -q -o bannertool.zip -d bannertool
          cp "$(find makerom -type f -name makerom | head -1)" ../3ds/makerom
          cp "$(find bannertool -type f -path '*linux*x86*64*' -name bannertool | head -1)" ../3ds/bannertool
          chmod +x ../3ds/makerom ../3ds/bannertool
      # Compilation et bannertool dans l'image devkitPro ; makerom sur l'hôte (il exige une glibc plus récente).
      # VERSION : celle du tag (v3.7.0 -> 3.7.0), "dev" sinon ; un build "dev" ne propose jamais de mise à jour (ADR 0021).
      - name: .3dsx, bannière, icône
        run: |
          case "$GITHUB_REF" in refs/tags/v*) version="${GITHUB_REF_NAME#v}" ;; *) version=dev ;; esac
          docker run --rm -u "$(id -u):$(id -g)" -v "$PWD:/src" -w /src/3ds -e VERSION="$version" devkitpro/devkitarm:20260610@sha256:116afba8df8453961de2936ffab20dd441edf4d682856c1ec8b0e53d7ed0bbf5 sh -c '
            make VERSION="$VERSION" &&
            ./bannertool makebanner -i meta/banner.png -a meta/banner.wav -o build/banner.bnr &&
            ./bannertool makesmdh -s "$(sed -n "s/^APP_TITLE[[:space:]]*:=[[:space:]]*//p" Makefile)" \
              -l "$(sed -n "s/^APP_DESCRIPTION[[:space:]]*:=[[:space:]]*//p" Makefile)" \
              -p "$(sed -n "s/^APP_AUTHOR[[:space:]]*:=[[:space:]]*//p" Makefile)" -i meta/icon.png -o build/icon.icn'
      - name: .cia
        working-directory: 3ds
        run: ./makerom -f cia -o 3dssavesync.cia -elf 3dssavesync.elf -rsf app.rsf -icon build/icon.icn -banner build/banner.bnr -exefslogo -target t
      - uses: actions/upload-artifact@v4
        with:
          name: homebrew-3ds
          path: |
            3ds/*.cia
            3ds/*.3dsx

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [serveur, tests-c, client-go, lint-go, homebrew-3ds, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: homebrew-3ds
          path: dist
      # Absent when the signing key is not set (android job): the release goes on without it.
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: android-release-apk
          path: dist
      - uses: actions/setup-go@v5
        with:
          go-version-file: client/go.mod
          cache: false
      # Le .cia de la même version, inclus dans le programme PC qui le copie sur la carte SD (ADR 0023) ; la version
      # du tag (v3.7.0 -> 3.7.0) pour la mise à jour du PC.
      - name: Binaires PC (sans console sous Windows)
        working-directory: client
        run: |
          cp ../dist/3dssavesync.cia embarque/3dssavesync.cia
          for cible in windows/amd64 windows/arm64 linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            os=${cible%/*}; arch=${cible#*/}; ext=; drapeaux="-s -w -X main.version=${GITHUB_REF_NAME#v}"
            if [ "$os" = windows ]; then ext=.exe; drapeaux="$drapeaux -H windowsgui"; fi
            GOOS=$os GOARCH=$arch CGO_ENABLED=0 go build -trimpath -ldflags "$drapeaux" -o "../dist/3dssavesync-$os-$arch$ext" .
          done
      # Version portable (ADR 0020) : l'exe et portable.txt (une seule source : .github/portable.txt), hors de dist/.
      - name: Archives portables
        run: |
          mkdir -p portable/windows portable/linux
          cp .github/portable.txt portable/windows/ && cp .github/portable.txt portable/linux/
          cp dist/3dssavesync-windows-amd64.exe portable/windows/3dssavesync.exe
          cp dist/3dssavesync-linux-amd64 portable/linux/3dssavesync && chmod +x portable/linux/3dssavesync
          (cd portable/windows && zip -q ../../dist/3dssavesync-windows-amd64-portable.zip 3dssavesync.exe portable.txt)
          tar -czf dist/3dssavesync-linux-amd64-portable.tar.gz -C portable/linux 3dssavesync portable.txt
      # Vérifié par la 3DS avant d'installer une mise à jour (ADR 0021).
      - name: SHA256SUMS
        working-directory: dist
        run: sha256sum -- * > SHA256SUMS && cat SHA256SUMS
      - name: Release GitHub
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          case "$GITHUB_REF_NAME" in *-*) pre=--prerelease ;; *) pre= ;; esac
          # Job relancé (ex. image refusée) : la release existe déjà, on remplace seulement ses fichiers.
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* --title "3dssavesync $GITHUB_REF_NAME" --generate-notes --verify-tag $pre
          fi
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      # amd64 and arm64 (NAS, Raspberry Pi). The Dockerfile has no RUN step, so no QEMU is needed.
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: server
          push: true
          platforms: linux/amd64,linux/arm64
          # « latest » seulement pour une vraie version (pas v3.0.0-alpha.1)
          tags: ghcr.io/${{ github.repository_owner }}/3dssavesync-server:${{ github.ref_name }}${{ !contains(github.ref_name, '-') && format(',ghcr.io/{0}/3dssavesync-server:latest', github.repository_owner) || '' }}
