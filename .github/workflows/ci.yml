name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  serveur:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m unittest -v test_server.py
        working-directory: server

  tests-c:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: etat, cle, fichiers (C hôte)
        working-directory: 3ds
        run: |
          gcc -std=c99 -Wall -I source source/etat.c test/test_etat.c -o /tmp/t && /tmp/t ../tests/cas_etat.csv
          gcc -std=c99 -Wall -I source source/cle.c test/test_cle.c -o /tmp/c && /tmp/c
          gcc -std=c99 -Wall -I source source/fichiers.c test/test_fichiers.c -o /tmp/f && (cd /tmp && /tmp/f)

  lanceur-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - shell: powershell
        run: |
          powershell -NoProfile -File pc/test_etat.ps1
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          powershell -NoProfile -File pc/test_lanceur.ps1
          exit $LASTEXITCODE

  homebrew-3ds:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest
    steps:
      - uses: actions/checkout@v4
      - name: makerom et bannertool
        run: |
          apt-get update -qq && apt-get install -y -qq unzip curl >/dev/null
          mkdir -p /opt/outils && cd /opt/outils
          curl -sSfLO https://github.com/3DSGuy/Project_CTR/releases/download/makerom-v0.19.0/makerom-v0.19.0-ubuntu_x86_64.zip
          curl -sSfLO https://github.com/Epicpkmn11/bannertool/releases/download/v1.2.2/bannertool.zip
          unzip -q -o makerom-v0.19.0-ubuntu_x86_64.zip -d makerom
          unzip -q -o bannertool.zip -d bannertool
          cp "$(find makerom -type f -name makerom | head -1)" /usr/local/bin/makerom
          cp "$(find bannertool -type f -path '*linux*x86*64*' -name bannertool | head -1)" /usr/local/bin/bannertool
          chmod +x /usr/local/bin/makerom /usr/local/bin/bannertool
          makerom -h | head -1 || true
      - name: .3dsx et .cia
        working-directory: 3ds
        run: make && make cia
      - uses: actions/upload-artifact@v4
        with:
          name: homebrew-3ds
          path: |
            3ds/*.cia
            3ds/*.3dsx

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [serveur, tests-c, lanceur-windows, homebrew-3ds]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: homebrew-3ds
          path: dist
      - name: Release GitHub
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "3dssavesync $GITHUB_REF_NAME" --generate-notes --verify-tag
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/build-push-action@v6
        with:
          context: server
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/3dssavesync-server:${{ github.ref_name }},ghcr.io/${{ github.repository_owner }}/3dssavesync-server:latest
