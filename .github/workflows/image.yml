# Republie l'image du serveur pour un tag déjà sorti, sans refaire la release (ex. après un refus d'accès au paquet).
name: image

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Tag déjà publié (ex. v3.0.0)"
        required: true

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.version }}
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      # amd64 and arm64 (NAS, Raspberry Pi). The Dockerfile has no RUN step, so no QEMU is needed.
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: server
          push: true
          platforms: linux/amd64,linux/arm64
          # « latest » seulement pour une vraie version (pas v3.0.0-alpha.1)
          tags: ghcr.io/${{ github.repository_owner }}/3dssavesync-server:${{ inputs.version }}${{ !contains(inputs.version, '-') && format(',ghcr.io/{0}/3dssavesync-server:latest', github.repository_owner) || '' }}
